<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#012F6B">
<title>Anciens de Louis</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Les Anciens">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: carnet de comptes mobile-first. En-tête marine collant (titre + frise des années), cartes, barre d'onglets et bouton « Dépense » flottants.
   Couleurs d'interface : marine #012F6B (structure) et jaune #FEEA00 (action et sélection). */
:root{
  --navy:#012F6B; --yellow:#FEEA00;
  --bg:#EDF1F8; --surface:#FFFFFF; --ink:#0A1A33; --ink2:#485973; --line:#D8DFEB;
  --accent:#012F6B; --accent-ink:#FFFFFF; --accent-soft:#E0E8F5;
  --top-bg:#012F6B; --top-ink:#FFFFFF; --top-dim:rgba(255,255,255,.76); --top-chip:rgba(255,255,255,.1); --top-line:rgba(255,255,255,.22);
  --pos:#17704A; --pos-soft:#DDF1E7; --neg:#B3321C; --neg-soft:#FBE6E1; --warn-soft:#FFF4CC; --warn:#6B4F00;
  --food:#B8730A; --act:#6A4DB8; --trans:#1F66B0; --loc:#1F8479;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050E1E; --surface:#0C1C36; --ink:#EAF0FA; --ink2:#9FB0CC; --line:#1C2F50;
  --accent:#FEEA00; --accent-ink:#012F6B; --accent-soft:#14294B;
  --top-bg:#012F6B;
  --pos:#5BD196; --pos-soft:#163326; --neg:#FF8A73; --neg-soft:#3A1E19; --warn-soft:#3A3410; --warn:#F5E27A;
  --food:#E5A53B; --act:#A992F0; --trans:#6FB1F0; --loc:#4FC9BA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050E1E; --surface:#0C1C36; --ink:#EAF0FA; --ink2:#9FB0CC; --line:#1C2F50;
  --accent:#FEEA00; --accent-ink:#012F6B; --accent-soft:#14294B;
  --top-bg:#012F6B;
  --pos:#5BD196; --pos-soft:#163326; --neg:#FF8A73; --neg-soft:#3A1E19; --warn-soft:#3A3410; --warn:#F5E27A;
  --food:#E5A53B; --act:#A992F0; --trans:#6FB1F0; --loc:#4FC9BA; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--top-bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.top button:focus-visible{outline-color:var(--yellow)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top-bg);color:var(--top-ink)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px}
.brand h1{font:800 1.15rem/1.1 var(--head);letter-spacing:.01em;margin:0}
.brand span{font-size:.75rem;color:var(--yellow);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.years{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px 0 12px;margin:0;list-style:none;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.years li{flex:none;scroll-snap-align:center}
.chip{display:flex;flex-direction:column;justify-content:center;min-width:76px;max-width:118px;min-height:52px;padding:6px 12px;border-radius:12px;border:1px solid var(--top-line);background:var(--top-chip);color:var(--top-ink)}
.chip b{font:800 1.05rem/1.1 var(--head)}
.chip small{font-size:.72rem;color:var(--top-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-current="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.chip[aria-current="true"] small{color:var(--navy);opacity:.85}

/* Contenu */
main{padding-block:18px 150px;display:flex;flex-direction:column;gap:16px}
.edhead{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.edhead h2{font:800 2rem/1.05 var(--head);margin:0;text-wrap:balance}
.edhead p{margin:4px 0 0;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{font:700 .8rem/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px}
.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.hero .lab{font-size:.85rem;opacity:.85;font-weight:500}
.hero .big{font:800 2.7rem/1.05 var(--head);margin:4px 0 8px;letter-spacing:-.01em;color:var(--yellow)}
.hero .sub{font-size:.95rem;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:.78rem;color:var(--ink2);font-weight:500}
.tile .v{font:700 1.25rem/1.2 var(--head);margin-top:2px;overflow-wrap:anywhere}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--line)}
.stack i{display:block;min-width:3px}
.legend{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.legend li{border-top:1px solid var(--line)}
.legend .lrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto 16px;align-items:center;gap:10px;width:100%;min-height:56px;padding:9px 0;text-align:left;color:inherit;font:inherit;background:none;border:0;cursor:pointer}
.legend .lrow:active{background:rgba(127,127,127,.12)}
.legend .chev{color:var(--ink2)}
.legend li:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:4px}
.legend .n{font-weight:600}
.legend .s{display:block;font-size:.8rem;color:var(--ink2);font-weight:400}
.legend .a{text-align:right;font-weight:600}
.food{--c:var(--food)}.act{--c:var(--act)}.trans{--c:var(--trans)}.loc{--c:var(--loc)}
.dot,.stack i{background:var(--c)}
.note{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.info{border-radius:12px;padding:12px 14px;background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.empty{text-align:center;color:var(--ink2);padding:28px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kvx{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;align-items:center;gap:10px;width:100%;padding:7px 0;text-align:left;font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.kvx>span:first-child{color:var(--ink2)}
.kvx small{display:block;font-size:.76rem;color:var(--ink2);opacity:.8}
.kvx b{font-weight:600;text-align:right}
.kvx .chev{width:16px;height:16px;color:var(--ink2);transition:transform .15s}
.kvx[aria-expanded="true"] .chev{transform:rotate(180deg)}
.xlist{list-style:none;margin:0 0 8px;padding:2px 0 2px 12px;border-left:3px solid var(--yellow)}
.xlist[hidden]{display:none}
.xlist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:.93rem}
.xlist li:first-child{border-top:0}
.xlist small{display:block;font-size:.76rem;color:var(--ink2)}
.xlist b{font-weight:600;white-space:nowrap}
.kv span:first-child{color:var(--ink2)}
.kv b{font-weight:600;text-align:right}
.key{font-size:.82rem;color:var(--ink2)}

/* Soldes */
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;font-size:.85rem;font-weight:600;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.p{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto 18px;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:64px}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 .9rem var(--head)}
.pn b{display:block;font-weight:700;font-size:1.05rem}
.pn small{display:block;color:var(--ink2);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{text-align:right;line-height:1.15}
.pv i{display:block;font-style:normal;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pv b{font:700 1.15rem var(--head);white-space:nowrap}
.pv.pos{color:var(--pos)}.pv.neg{color:var(--neg)}.pv.zero{color:var(--ink2)}
.chev{width:18px;height:18px;color:var(--ink2);transition:transform .15s}
.prow[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dv{position:relative;height:6px;background:var(--line);margin:0 14px 12px;border-radius:3px}
.dv::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink2);opacity:.5}
.dv i{position:absolute;top:0;bottom:0;border-radius:3px}
.dv i.pos{left:50%;background:var(--pos)}
.dv i.neg{right:50%;background:var(--neg)}
.pd{border-top:1px solid var(--line);padding:12px 14px 14px;background:var(--bg);font-size:.92rem}
.pd .kv{padding:5px 0}
.pd .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.pd .tot span,.pd .tot b{color:var(--ink)}
.pd p{margin:8px 0 0;color:var(--ink2);font-size:.88rem}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent-soft);font-size:.8rem;font-weight:600;margin-top:8px}
.muted .prow{min-height:56px}
.muted .av{background:var(--line);color:var(--ink2)}
.muted .pv b{font:600 .95rem var(--body);color:var(--ink2)}

/* Dépenses et trajets */
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem}
.fchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchips .dot{width:9px;height:9px;border-radius:50%}
.fchips button[aria-pressed="true"] .dot{outline:2px solid var(--accent-ink)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.bars .l{font-weight:600;overflow-wrap:anywhere}
.bars .l small{display:block;font-weight:400;color:var(--ink2);font-size:.8rem}
.bars .a{font-weight:700;text-align:right;white-space:nowrap}
.bars .t{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.elist{list-style:none;margin:0;padding:0}
.elist li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.elist li:first-child{border-top:0}
.elist .dot{margin-top:5px}
.elist .l{font-weight:600;overflow-wrap:anywhere}
.elist .l small{display:block;font-weight:400;color:var(--ink2);font-size:.82rem}
.elist .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.elist .a{font-weight:700;white-space:nowrap}
.del{font-size:.78rem;font-weight:600;color:var(--ink2);padding:6px 8px;margin:-2px -8px -6px 0;border-radius:8px;text-decoration:underline}
.acts{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.led{display:inline-block;width:11px;height:11px;margin-left:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.28);vertical-align:middle}
.settle{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;margin-top:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);text-align:left;font-weight:700;background:var(--surface);color:inherit}
.settle .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink2);flex:none;display:grid;place-items:center}
.settle.on{border-color:#16a34a;background:rgba(34,197,94,.12)}
.settle.on .box{background:#16a34a;border-color:#16a34a}
.settle.on .box::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.settle:disabled{opacity:.6}
.okline{display:flex;align-items:center;margin:8px 0 0;font-weight:700;color:var(--pos)}
.okline .led{margin:0 8px 0 0}
.hint.warn{color:var(--neg)}
.del.sure{color:#fff;background:var(--neg);text-decoration:none;padding:6px 10px;margin:0}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:2px 2px 0}
.sum b{font:800 1.4rem var(--head)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:600;margin-left:4px}
.fchips button[aria-pressed="true"] .pill{background:rgba(255,255,255,.2);color:inherit}
.tag{display:inline-block;padding:0 7px;border-radius:999px;background:var(--yellow);color:var(--navy);font-size:.7rem;font-weight:700;margin-left:6px;vertical-align:1px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.players button{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:.9rem;background:var(--surface)}
.players button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.players button:disabled{opacity:.6;cursor:default}

/* Accueil */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
.logo{width:min(80vw,310px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid var(--yellow);background:#fff;box-shadow:0 0 0 4px var(--navy)}
.logo img{display:block;width:100%;height:100%;object-fit:cover}
.home h2{font:800 2.4rem/1.05 var(--head);margin:14px 0 0}
.home p{margin:0;color:var(--ink2)}
.ylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.yrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.yrow .y{font:800 1.2rem var(--head)}
.yrow .pl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.yrow .t{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;display:block}
.yrow .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.yrow .r{text-align:right;line-height:1.2}
.yrow .r b{display:block;font-weight:700}
.yrow .r small{color:var(--ink2);font-size:.78rem}
.yrow[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sechead{font:700 .8rem/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:6px 0 -4px}

/* Onglets, bouton flottant, formulaire */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:6px 2px;font-size:.72rem;font-weight:600;color:var(--ink2)}
.tabs .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}
.tabs svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] .ic{background:var(--yellow);color:var(--navy)}
.tabs button[aria-selected="true"] svg{stroke-width:2.4}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--yellow);color:var(--navy);font-weight:700;box-shadow:0 4px 14px rgba(1,47,107,.35),0 0 0 2px var(--navy)}
.fab svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(1,12,30,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.sh-h h3{font:800 1.3rem var(--head);margin:0}
.sh-x{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--bg)}
.sheet label,.sheet legend{font-size:.82rem;font-weight:600;color:var(--ink2);margin-top:8px;padding:0}
.sheet fieldset{border:0;margin:0;padding:0;min-width:0}
.sheet input,.sheet select{width:100%;min-height:48px;padding:10px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px}
.catpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.catpick button{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;background:var(--bg)}
.catpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.catpick .dot{width:10px;height:10px;border-radius:50%}
.hint{margin:6px 0 0;font-size:.85rem;color:var(--ink2)}
.err{margin:4px 0 0;font-size:.88rem;color:var(--neg);font-weight:600;min-height:1.2em}
.btn{min-height:52px;border-radius:14px;background:var(--yellow);color:var(--navy);font-weight:800;font-size:1.05rem;text-align:center;box-shadow:inset 0 0 0 2px var(--navy);margin-top:6px}
.btn:disabled{opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100% - 32px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;box-shadow:0 4px 14px rgba(0,0,0,.3)}
footer.src{color:var(--ink2);font-size:.78rem;text-align:center;padding:4px 0}
@media (min-width:700px){.edhead h2{font-size:2.5rem}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.scrim{align-items:center}.sheet{border-radius:20px}}
.brand #sync{font-size:.72rem;letter-spacing:.04em;text-transform:none;font-weight:600}

#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;text-align:center}
#gate[hidden]{display:none!important}
#gate img{width:min(62vw,260px);height:auto;border-radius:50%;box-shadow:0 0 0 4px var(--yellow)}
#gate h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:2rem;margin:6px 0 0;color:var(--yellow)}

#who .wlist button:active{background:var(--yellow);color:var(--navy)}
.pushbar{display:flex;flex-direction:column;gap:10px;margin:0 0 14px;padding:14px 16px;border-radius:16px;background:var(--navy);color:#fff}

.pushbar button{min-height:46px;padding:0 18px;border-radius:12px;font-weight:800}
.pushbar .go{background:var(--yellow);color:var(--navy)}
.pushbar .later{border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:600}
.devcard{margin:18px 0 0}
.devcard .kv button{color:var(--ink);font-weight:700;text-decoration:underline;min-height:36px}

const sgn = v => (v>0.004?'+':v<-0.004?'−':'')+nf.format(Math.abs(v));
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Séjours 2026+ : construits à partir du Google Sheet ---------- */
function buildRemote(R){
  return R.editions.map(ed=>{
    const rows = R.expenses.filter(x=>x.edition===ed.id).map(x=>({cat:x.categorie,label:x.libelle,amount:x.montant,payer:x.paye_par||null,id:x.id}));
    const pr = R.participants.filter(p=>p.edition===ed.id);
    const trans = rows.filter(x=>x.cat==='Transport');
    const tm = {};
    trans.forEach(x=>{ const k=x.payer||CPT; const t=(tm[k] ||= {name:k,detail:[],car:0,plane:0,amount:0});
      t.amount=r2(t.amount+x.amount); t.car=t.amount; const d=x.label.replace(/^Trajet · [^ (]+ ?/,'').replace(/^\((.*)\)$/,'$1'); if (d) t.detail.push(d); });
    const trips = Object.values(tm).map(t=>({...t,detail:t.detail.join(' · ')}));
    const tripsTotal = r2(trans.reduce((s,x)=>s+x.amount,0));
    const siteTotal = r2(rows.filter(x=>x.cat!=='Transport').reduce((s,x)=>s+x.amount,0));
    const global_ = r2(tripsTotal+siteTotal);
    const n = pr.filter(p=>p.participe).length;
    const perPerson = n ? r2(global_/n) : 0;
    const paidBy = {};
    rows.forEach(x=>{ if (x.payer) paidBy[x.payer]=r2((paidBy[x.payer]||0)+x.amount); });
    const participants = pr.map(p=>{
      const trip = r2(trans.filter(x=>x.payer===p.nom).reduce((s,x)=>s+x.amount,0));
      const paid = r2(rows.filter(x=>x.cat!=='Transport' && x.payer===p.nom).reduce((s,x)=>s+x.amount,0));
      const share = p.participe ? perPerson : 0;
      return {name:p.nom,label:p.detail,verse:p.verse,player:p.participe,trip,paid,balance:r2(p.verse+trip+paid-share),settled:p.regle_le||'',settledAmt:(p.regle_montant==null||p.regle_montant==='')?null:p.regle_montant};
    });
    const poles = CAT_ORDER.map(c=>({cat:c,total:r2(rows.filter(x=>x.cat===c).reduce((s,x)=>s+x.amount,0))}));
    const totalVerse = r2(pr.reduce((s,p)=>s+p.verse,0));
    return {id:ed.id,year:ed.annee,place:ed.lieu,sheet:'Google Sheet',remote:true,status:global_>0?'done':'upcoming',
      expenses:rows,trips,baseTrips:[],tripsTotal,siteTotal,location:0,locationPaid:[],global_,n:n||1,perPerson,paidBy,
      participants,poles,totalVerse,redistrib:totalVerse,redistribNote:null,notes:[],avion:false};
  }).sort((a,b)=>a.year-b.year);
}
function rebuild(){
  D = ARCHIVE.concat(buildRemote(REMOTE));
  if (cur) cur = byId(cur.id) || cur;
}

function pstate(p){
  if (p.note) return 'don';
  const z = !(p.verse||0) && !p.trip && !p.paid;
  if (p.player===false && z) return 'absent';
  if (p.player===undefined && z && (p.balance==null || p.balance===0)) return 'absent';
  return 'ok';
}
const finalBal = p => p.adjusted ?? p.balance;

/* ---------- En-tête ---------- */
function renderYears(){
  $('years').innerHTML = D.slice().sort((a,b)=>b.year-a.year).map(e=>`<li><button class="chip" data-id="${e.id}" aria-current="${tab!=='ann' && e.id===cur.id}" aria-label="${e.year} ${esc(label(e))}"><b class="num">${e.year}</b><small>${esc(label(e))}</small></button></li>`).join('');
  if (scrollChip) { scrollChip=false; const a = $('years').querySelector('[aria-current="true"]'); if (a) a.parentElement.scrollIntoView({inline:'center',block:'nearest'}); }
}
function renderTabs(){
  $('tabs').innerHTML = TABS.map(([k,n,svg])=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${svg}</svg></span>${n}</button>`).join('');
}

/* ---------- Synthèse ---------- */
function head(m){
  const sub = !m.global_ ? 'Édition en préparation' : `${m.n} participants · ${eur(m.perPerson)} par personne`;
  return `<header class="edhead"><span class="eyebrow">Édition ${m.year}</span><h2>${esc(label(m))}</h2><p>${sub}</p></header>`;
}
function roNote(m){
  if (!editable(m)) return '';
  if (!API_URL) return `<div class="note">Mode démonstration : les dépenses ne sont pas enregistrées tant que le site n’est pas relié au Google Sheet (voir LISEZ-MOI.md).</div>`;
  if (syncState==='offline') return `<div class="note">Hors ligne : ce sont les dernières données connues. Les modifications reprendront dès le retour de la connexion.</div>`;
  return '';
}
function viewSyn(m){
  if (!m.global_) {
    const tot = m.participants.reduce((s,p)=>s+(p.verse||0),0);
    const mx = Math.max(1,...m.participants.map(x=>x.verse||0));
    return head(m)+roNote(m)+`<section class="card hero"><div class="lab">Cotisations déjà versées</div><div class="big num">${eur(tot)}</div><div class="sub">Aucun séjour ni dépense n’est encore saisi pour ${m.year}. Touchez « Dépense » pour commencer.</div></section>`
      +`<section class="card"><h3>Cotisations par personne</h3><ul class="bars">${m.participants.filter(p=>p.verse).sort((a,b)=>b.verse-a.verse).map(p=>`<li><span class="l">${esc(p.name)}${p.label?`<small>${esc(cl(p.label))}</small>`:''}</span><span class="a num">${eur(p.verse)}</span><span class="t"><i style="width:${p.verse/mx*100}%"></i></span></li>`).join('')}</ul></section>`;
  }
  const poles = CAT_ORDER.map(c=>({c,t:m.poles.find(x=>x.cat===c)?.total||0})).filter(x=>x.t>0.004);
  const sp = poles.reduce((s,x)=>s+x.t,0);
  let h = head(m)+roNote(m);
  h += `<section class="card hero"><div class="lab">Coût du séjour par personne</div><div class="big num">${eur(m.perPerson)}</div><div class="sub num">${eur(m.global_)} au total, partagés entre ${m.n} personnes</div></section>`;
  const tiles = [['Trajets',m.tripsTotal],['Dépenses sur place',m.siteTotal]];
  if (m.location>0) tiles.push(['Location',m.location]);
  if (m.totalVerse) tiles.push(['Versé dans l’année',m.totalVerse]);
  h += `<div class="tiles">${tiles.map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v num">${eur(v)}</div></div>`).join('')}</div>`;
  h += `<section class="card"><h3>Où va l’argent</h3><div class="stack" role="img" aria-label="Répartition par poste">${poles.map(x=>`<i class="${CATS[x.c]}" style="flex:${x.t}"></i>`).join('')}</div><ul class="legend">${poles.map(x=>`<li class="${CATS[x.c]}"><button type="button" class="lrow" data-goto="${x.c}" aria-label="Voir le détail : ${x.c}"><span class="dot"></span><span class="n">${x.c}<span class="s num">${Math.round(x.t/sp*100)} % · ${eur(x.t/m.n)} par personne</span></span><span class="a num">${eur(x.t)}</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>`).join('')}</ul></section>`;
  if (m.location>0 && m.locationPaid.length) h += `<div class="info">Location payée : ${esc(m.locationPaid.join(' · '))}.</div>`;
  (m.notes||[]).forEach(n=>h+=`<div class="note">${esc(n)}</div>`);
  if (m.redistrib!=null) h += `<section class="card"><div class="kv"><span>Total à redistribuer</span><b class="num">${eur(m.redistrib)}</b></div><div class="kv"><span>Versé dans l’année</span><b class="num">${eur(m.totalVerse)}</b></div>${m.redistribNote?`<p class="key" style="margin:6px 0 0">« ${esc(m.redistribNote)} »</p>`:''}</section>`;
  h += `<footer class="src">${editable(m)?'Source : Google Sheet partagé, synchronisé automatiquement':`Source : onglet « ${esc(m.sheet)} »`}</footer>`;
  return h;
}

/* ---------- Soldes ---------- */
function viewSol(m){
  const ps = m.participants.map((p,i)=>({p,i,s:pstate(p)}));
  const act = ps.filter(x=>x.s==='ok'), other = ps.filter(x=>x.s!=='ok');
  if (sortBal) act.sort((a,b)=>finalBal(b.p)-finalBal(a.p));
  const max = Math.max(1,...act.map(x=>Math.abs(finalBal(x.p)||0)));
  const open = i => openRows.has(m.id+':'+i);
  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const row = ({p,i})=>{
    const f = finalBal(p)||0, cls = f>0.004?'pos':f<-0.004?'neg':'zero';
    const verb = f>0.004?'reçoit':f<-0.004?'doit verser':'à l’équilibre';
    return `<li class="p"><button class="prow" data-i="${i}" aria-expanded="${open(i)}" aria-controls="pd${i}"><span class="av" aria-hidden="true">${ini(p.name)}</span><span class="pn"><b>${esc(p.name)}${isClosed(m,p)?'<span class="led" role="img" aria-label="Compte bon" title="Compte bon"></span>':''}</b>${plabel(m,p)?`<small>${esc(plabel(m,p))}</small>`:''}</span><span class="pv ${cls}"><i>${verb}</i><b class="num">${sgn(f)}</b></span>${chev}</button><div class="dv" aria-hidden="true">${cls==='zero'?'':`<i class="${cls}" style="width:${Math.abs(f)/max*50}%"></i>`}</div><div class="pd" id="pd${i}" ${open(i)?'':'hidden'}>${detail(m,p)}</div></li>`;
  };
  const rowOther = ({p,i,s})=>`<li class="p muted"><button class="prow" data-i="${i}" aria-expanded="${open(i)}" aria-controls="pd${i}"><span class="av" aria-hidden="true">${ini(p.name)}</span><span class="pn"><b>${esc(p.name)}</b>${plabel(m,p)?`<small>${esc(plabel(m,p))}</small>`:''}</span><span class="pv"><b>${s==='don'?'Don':'Absent'}</b></span>${chev}</button><div class="pd" id="pd${i}" ${open(i)?'':'hidden'}>${s==='don'?`<p style="margin:0">${esc(p.note)}</p>${p.verse?`<div class="kv"><span>Cotisation versée</span><b class="num">${eur(p.verse)}</b></div>`:''}`:`<p style="margin:0">N’a pas participé à ce séjour${p.label?` (${esc(plabel(m,p))})`:''}.</p>`}</div></li>`;
  let h = head(m)+roNote(m);
  h += `<div class="tools"><span class="key">Touchez une ligne pour le détail.</span><div class="seg" role="group" aria-label="Tri"><button data-sort="0" aria-pressed="${!sortBal}">Ordre du fichier</button><button data-sort="1" aria-pressed="${sortBal}">Par solde</button></div></div>`;
  h += `<ul class="plist">${act.map(row).join('')}</ul>`;
  if (other.length) h += `<ul class="plist">${other.map(rowOther).join('')}</ul>`;
  if (editable(m)) {
    const P = new Set(m.participants.filter(p=>p.player).map(p=>p.name));
    h += `<section class="card"><h3>Qui partage le coût ?</h3><div class="players" role="group" aria-label="Participants au séjour">${m.participants.map(p=>`<button data-player="${esc(p.name)}" aria-pressed="${P.has(p.name)}" ${canWrite()?'':'disabled'}>${esc(p.name)}</button>`).join('')}</div><p class="hint">Le coût total est divisé entre les personnes sélectionnées, soit ${m.n} aujourd’hui. Les soldes se mettent à jour à chaque changement.${m.id==='2026-clermont-ferrand'?' Le fichier d’origine divisait par 7 en listant 8 personnes : Vince n’est donc pas sélectionné par défaut.':''}</p></section>`;
  }
  h += `<p class="key" style="margin:0">Solde positif : la personne reçoit de l’argent du groupe. Solde négatif : elle doit en verser.</p>`;
  return h;
}
function xrow(m,p,kind,label,total){
  const rows = expenseRows(m).filter(x=>x.payer===p.name && (kind==='trip' ? x.cat==='Transport' : x.cat!=='Transport'));
  const sum = rows.reduce((s,x)=>s+x.amount,0), rest = r2(total-sum);
  if (!rows.length && rest<0.06) return `<div class="kv"><span>${label}</span><b class="num">${eur(total)}</b></div>`;
  const id = 'xp_'+kind+'_'+Array.from(m.id+p.name).map(c=>c.charCodeAt(0).toString(36)).join(''), key = m.id+':x:'+p.name+':'+kind;
  const op = openRows.has(key);
  let li = rows.map(x=>`<li><span>${esc(x.label)}<small>${esc([x.cat,x.sub].filter(Boolean).join(' · '))}</small></span><b class="num">${eur(x.amount)}</b></li>`).join('');
  if (rest>=0.06) li += `<li><span>Autres paiements${m.avion?' (billets d’avion)':''}<small>voir le fichier d’origine</small></span><b class="num">${eur(rest)}</b></li>`;
  return `<button type="button" class="kvx" data-xp="${key.replace(/"/g,'')}" aria-expanded="${op}" aria-controls="${id}"><span>${label}<small>${rows.length+(rest>=0.06?1:0)} élément${rows.length+(rest>=0.06?1:0)>1?'s':''}</small></span><b class="num">${eur(total)}</b><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><ul class="xlist" id="${id}" ${op?'':'hidden'}>${li}</ul>`;
}
const MOIS = 'janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre';
const RE_DATE = new RegExp('\\b(?:depuis\\s+(?:le\\s+)?|1er\\s+le\\s+|le\\s+)?\\d{1,2}(?:er)?\\s*(?:\\/\\s*\\d{1,2}(?:\\/\\s*\\d{2,4})?|\\s(?:'+MOIS+')(?:\\s+\\d{4})?)', 'gi');
const RE_MOIS = new RegExp('(?:\\s|^)(?:(?:'+MOIS+')(?:\\s*,\\s*|\\s+et\\s+|\\s*$))+', 'gi');
function plabel(m,p){
  let s = cl(p.label);
  if (m.year===2027 && p.name==='Vince') return s;
  s = s.replace(RE_DATE,'').replace(RE_MOIS,' ');
  const st=[], bad=new Set();
  for (let i=0;i<s.length;i++){ if (s[i]==='(') st.push(i); else if (s[i]===')') { if (st.length) st.pop(); else bad.add(i); } }
  st.forEach(i=>bad.add(i));
  s = Array.from(s).filter((c,i)=>!bad.has(i)).join('');
  return s.replace(/\s{2,}/g,' ').replace(/\s+([,.;:])/g,'$1').replace(/^[\s,;:.+\-–]+|[\s,;:.+\-–]+$/g,'').trim();
}
const fmtD = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'') ? s.split('-').reverse().join('/') : (s||'');
function isClosed(m,p){
  if (!editable(m) || pstate(p)!=='ok') return false;
  const f = finalBal(p)||0; if (Math.abs(f)<0.005) return false;
  const i = settleInfo(m,p);
  return !!i.date && (i.amt==null || Math.abs(i.amt-f)<0.01);
}
function settleBlock(m,p){
  if (!editable(m) || pstate(p)!=='ok') return '';
  const f = finalBal(p)||0; if (Math.abs(f)<0.005) return '';
  const i = settleInfo(m,p), closed = isClosed(m,p), pos = f>0;
  const verb = pos ? 'Virement effectué' : 'Virement reçu';
  let h = `<button type="button" class="settle${closed?' on':''}" role="switch" aria-checked="${closed}" data-settle="${esc(p.name)}" ${canWrite()?'':'disabled'}><span class="box" aria-hidden="true"></span><span>${verb}${closed?` le ${fmtD(i.date)}`:''}</span></button>`;
  if (closed) h += `<p class="okline"><span class="led" aria-hidden="true"></span>Compte bon</p>`;
  else if (i.date) h += `<p class="hint warn">Le solde a changé depuis le virement du ${fmtD(i.date)}. Cochez à nouveau une fois le complément réglé.</p>`;
  else h += `<p class="hint">${pos?`À cocher quand ${eur(f)} ont été virés à ${esc(p.name)}.`:`À cocher quand ${esc(p.name)} a viré ${eur(-f)}.`}</p>`;
  return h;
}
const settleInfo = (m,p) => ({date:p.settled||'', amt:p.settledAmt==null?null:p.settledAmt});
async function toggleSettle(name){
  const p = cur.participants.find(x=>x.name===name); if (!p || !canWrite()) return;
  const f = r2(finalBal(p)||0), want = !isClosed(cur,p);
  try { await api({action:'setSettled',edition:cur.id,nom:name,regle:want,montant:f}); toast(want ? (f>0?'Virement noté comme effectué':'Virement noté comme reçu') : 'Virement décoché'); }
  catch(e) { toast(netErr(e)); }
}
function detail(m,p){
  const verse=p.verse||0, trip=p.trip||0, paid=p.paid||0;
  const share = p.player===false ? 0 : m.perPerson;
  let h='';
  const calc = verse+trip+paid-share;
  if (p.balance!=null && Math.abs(calc-p.balance)<0.06) {
    h += `<div class="kv"><span>Versé dans l’année</span><b class="num">${eur(verse)}</b></div>`;
    if (trip) h += xrow(m,p,'trip','Trajets avancés',trip);
    if (paid) h += xrow(m,p,'paid','Payé sur place',paid);
    h += p.player===false ? `<div class="kv"><span>Part du séjour</span><b>ne partage pas le coût</b></div>` : `<div class="kv"><span>Part du séjour (${eur(m.global_)} ÷ ${m.n})</span><b class="num">− ${eur(share)}</b></div>`;
    h += `<div class="kv tot"><span>Solde</span><b class="num">${sgn(p.balance)}</b></div>`;
  } else {
    if (verse) h += `<div class="kv"><span>Versé dans l’année</span><b class="num">${eur(verse)}</b></div>`;
    if (p.depense!=null) h += `<div class="kv"><span>Dépenses individuelles</span><b class="num">${eur(p.depense)}</b></div>`;
    h += `<div class="kv tot"><span>Solde</span><b class="num">${sgn(p.balance||0)}</b></div>`;
  }
  if (p.adjusted!=null && p.balance!=null) h += `<div class="kv"><span>${esc(m.adjLabel||'Solde ajusté')}</span><b class="num">${sgn(p.adjusted)}</b></div>`;
  h += settleBlock(m,p);
  if (p.status) h += `<span class="badge">${esc(p.status==='x'?'Réglé':p.status)}</span>`;
  if (p.extra) h += `<p>${esc(p.extra)}</p>`;
  return h;
}

/* ---------- Dépenses ---------- */
function expenseRows(e){
  const rows = e.expenses.map(x=>({...x}));
  if (!e.avion) (e.baseTrips||e.trips).forEach(t=>{ if (t.amount>0) rows.unshift({cat:'Transport',label:'Trajet · '+t.name,amount:t.amount,payer:t.name,sub:cl(t.detail)||'aller-retour'}); });
  if (e.location>0) rows.unshift({cat:'Location',label:'Location du logement',amount:e.location,payer:null,sub:e.locationPaid.join(' · ')});
  if (e.avion) {
    const pl = e.trips.reduce((s,t)=>s+t.plane,0);
    if (pl>0) rows.unshift({cat:'Transport',label:'Billets d’avion (aller-retour)',amount:pl,payer:null,sub:'Mutualisés entre les participants'});
  }
  return rows;
}
function viewDep(m){
  const all = expenseRows(m);
  const cats = CAT_ORDER.filter(c=>all.some(x=>x.cat===c));
  if (catF!=='all' && !CAT_ORDER.includes(catF)) catF='all';
  const chipCats = editable(m) ? CAT_ORDER : cats;
  const rows = all.filter(x=>catF==='all'||x.cat===catF);
  const tot = rows.reduce((s,x)=>s+x.amount,0);
  let h = head(m)+roNote(m);
  h += `<div class="fchips" role="group" aria-label="Filtrer par poste"><button data-cat="all" aria-pressed="${catF==='all'}">Tout <span class="pill">${all.length}</span></button>${chipCats.map(c=>`<button class="${CATS[c]}" data-cat="${c}" aria-pressed="${catF===c}"><span class="dot"></span>${c}</button>`).join('')}</div>`;
  const item = x=>`<li class="${CATS[x.cat]}"><span class="dot" title="${x.cat}"></span><span class="l">${esc(x.label)}${x.added?'<span class="tag">ajoutée</span>':''}<small>${[x.cat,x.payer?'payé par '+esc(x.payer):'',x.sub?esc(x.sub):''].filter(Boolean).join(' · ')}</small></span><span class="r"><span class="a num">${eur(x.amount)}</span>${m.remote&&x.id&&canWrite()?`<span class="acts"><button class="del" data-edit="${esc(x.id)}" aria-label="Modifier ${esc(x.label)}">Modifier</button>${(delPending===x.id?`<button class="del sure" data-del="${esc(x.id)}">Confirmer</button>`:`<button class="del" data-del="${esc(x.id)}" aria-label="Supprimer ${esc(x.label)}">Supprimer</button>`)}</span>`:''}</span></li>`;
  h += `<section class="card"><div class="sum"><span class="key">${catF==='all'?'Total des dépenses':esc(catF)}</span><b class="num">${eur(tot)}</b></div><ul class="elist" style="margin-top:8px">${rows.length?rows.map(item).join(''):`<li class="empty" style="display:block">Aucune dépense dans ce poste.${editable(m)&&canWrite()?' Touchez « Dépense » pour en ajouter une.':''}</li>`}</ul></section>`;
  const pb = Object.entries(m.paidBy).sort((a,b)=>b[1]-a[1]);
  if (pb.length && catF==='all') {
    const mx = pb[0][1];
    h += `<section class="card"><h3>Qui a avancé</h3><ul class="bars">${pb.map(([n,v])=>`<li><span class="l">${esc(n)}</span><span class="a num">${eur(v)}</span><span class="t"><i style="width:${v/mx*100}%"></i></span></li>`).join('')}</ul></section>`;
  }
  return h;
}

/* ---------- Trajets ---------- */
function viewTra(m){
  const ts = [...m.trips].sort((a,b)=>b.amount-a.amount);
  const paid = ts.filter(t=>t.amount>0), free = ts.filter(t=>t.amount<=0 && m.participants.some(p=>p.name===t.name && pstate(p)==='ok'));
  const mx = Math.max(1,...ts.map(t=>t.amount));
  const what = m.avion ? 'Billets d’avion' : 'Total des trajets';
  let h = head(m)+roNote(m);
  h += `<div class="tiles"><div class="tile"><div class="k">${what}</div><div class="v num">${eur(m.tripsTotal)}</div></div><div class="tile"><div class="k">Moyenne par personne</div><div class="v num">${eur(m.tripsTotal/m.n)}</div></div></div>`;
  h += `<section class="card"><h3>${m.avion?'Billet par personne':'Frais avancés par personne'}</h3>${paid.length?`<ul class="bars">${paid.map(t=>`<li><span class="l">${esc(t.name)}${t.detail?`<small>${esc(t.detail)}</small>`:''}</span><span class="a num">${eur(t.amount)}</span><span class="t"><i style="width:${t.amount/mx*100}%"></i></span></li>`).join('')}</ul>`:'<p class="empty" style="margin:0">Aucun frais de trajet saisi.</p>'}${free.length?`<p class="key" style="margin:14px 0 0">Sans frais déclarés : ${free.map(t=>esc(t.name)).join(', ')}.</p>`:''}</section>`;
  h += `<p class="key" style="margin:0">${m.avion?'Les billets sont partagés à parts égales, comme la location.':'Chacun avance ses frais de route. Le total est ensuite réparti à parts égales dans le coût du séjour.'}${editable(m)&&canWrite()?' Pour ajouter un trajet, touchez « Dépense » et choisissez la catégorie Transport.':''}</p>`;
  return h;
}

/* ---------- Accueil ---------- */
function viewAnn(){
  const ms = D.map(model);
  const done = ms.filter(m=>m.global_>0);
  const total = done.reduce((s,m)=>s+m.global_,0);
  const mx = Math.max(...done.map(m=>m.perPerson));

  h += `<div class="sechead">Choisir un séjour</div><ul class="ylist">${ms.slice().sort((x,y)=>y.year-x.year).map(m=>`<li><button class="yrow" data-open="${m.id}" aria-current="${m.id===cur.id}"><span class="y num">${m.year}</span><span style="min-width:0"><span class="pl">${esc(label(m))}</span>${m.global_>0?`<span class="t"><i style="width:${m.perPerson/mx*100}%"></i></span>`:''}</span><span class="r">${m.global_>0?`<b class="num">${eur(m.perPerson)}</b><small>par personne · ${m.n} pers.</small>`:'<small>en préparation</small>'}</span></button></li>`).join('')}</ul>`;

/* ---------- Rendu et routage ---------- */
function render(){
  renderYears(); renderTabs();
  const m = model(cur);
  const v = {syn:viewSyn,sol:viewSol,dep:viewDep,tra:viewTra,ann:viewAnn}[tab];
  $('main').innerHTML = pushBar() + v(m) + deviceCard();
  $('fab').hidden = !(editable(cur) && tab!=='ann' && canWrite());
}
function setEdition(id, keepTab){
  const e = byId(id) || D.filter(x=>x.global_>0).slice(-1)[0];
  cur = e; if (!keepTab) tab = 'syn';
  delPending = null; scrollChip = true;
  if (location.hash.slice(1)!==e.id) history.replaceState(null,'','#'+e.id);
  render(); window.scrollTo(0,0);
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{t.hidden=true},3200);
}
const dbErr = e => (e&&e.code==='invalid_argument') ? 'Écriture refusée : votre accès ne permet pas de modifier ces comptes.' : 'Enregistrement impossible pour le moment. Réessayez dans un instant.';

/* ---------- Formulaire d'ajout ---------- */
function parseAmount(s){
  const v = parseFloat(String(s).replace(/\s/g,'').replace(',','.'));
  return isFinite(v) ? r2(v) : NaN;
}
let editId = null, editOld = 0;
function openSheet(exp){
  const m = model(cur);
  editId = exp ? exp.id : null; editOld = exp ? exp.amount : 0;
  sheetCat = exp ? exp.cat : (catF!=='all' && CAT_ORDER.includes(catF)) ? catF : (tab==='tra' ? 'Transport' : 'Nourriture');
  $('sh-t').textContent = exp ? `Modifier la dépense · ${cur.year}` : `Ajouter une dépense · ${cur.year}`;
  $('f-ok').textContent = exp ? 'Enregistrer les modifications' : 'Ajouter la dépense';
  const names = m.participants.map(p=>p.name);
  if (exp && exp.payer && exp.payer!==CPT && !names.includes(exp.payer)) names.push(exp.payer);
  if (!lastPayer || !names.includes(lastPayer)) lastPayer = names[0];
  $('f-payer').innerHTML = names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('') + `<option value="${CPT}">${CPT}</option>`;
  $('f-payer').value = exp ? (exp.payer || CPT) : lastPayer;
  $('f-label').value = exp ? exp.label : ''; $('f-amount').value = exp ? String(exp.amount).replace('.',',') : ''; $('f-err').textContent='';
  drawCats(); updateHint();
  $('scrim').hidden = false;
  setTimeout(()=>$('f-label').focus(),30);
}
function closeSheet(){ editId = null; $('scrim').hidden = true; $('fab').focus?.(); }
function drawCats(){
  $('f-cats').innerHTML = CAT_ORDER.map(c=>`<button type="button" class="${CATS[c]}" data-fcat="${c}" aria-pressed="${sheetCat===c}"><span class="dot"></span>${c}</button>`).join('');
}
function updateHint(){
  const m0 = cur, amt = parseAmount($('f-amount').value);
  let t = `Part actuelle : ${eur(m0.perPerson)} par personne.`;
  if (amt>0 && !isNaN(amt) && m0.n) {
    t = `Part par personne : ${eur(m0.perPerson)} → ${eur(r2((m0.global_-editOld+amt)/m0.n))}.`;
    if ($('f-payer').value===CPT) t += ' Payé avec la caisse commune : aucun remboursement individuel.';
  }
  $('f-hint').textContent = t;
}
const netErr = e => (e instanceof TypeError) ? 'Enregistrement impossible : vérifiez la connexion.' : (e && e.message) || 'Enregistrement impossible.';
async function api(payload){
  writing++;
  try {
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({pwd:PWD},payload))});
    const j = await r.json();
    if (!j.ok) { if (j.auth) lock(); throw new Error(j.error || 'Erreur du serveur.'); }
    syncState='ok'; lastSync=new Date(); applyRemote(j.data); return j.data;
  } finally { writing--; }
}
async function submitAdd(ev){
  ev.preventDefault();
  const lab = $('f-label').value.trim(), amount = parseAmount($('f-amount').value), payer = $('f-payer').value;
  const err = $('f-err');
  if (!lab) { err.textContent='Indiquez un libellé.'; $('f-label').focus(); return; }
  if (!(amount>0)) { err.textContent='Indiquez un montant supérieur à 0, par exemple 42,50.'; $('f-amount').focus(); return; }
  if (!canWrite()) { err.textContent='Enregistrement indisponible pour le moment.'; return; }
  const btn = $('f-ok'); btn.disabled = true; btn.textContent = 'Enregistrement…'; err.textContent='';
  try {
    if (editId) { await api({action:'updateExpense',id:editId,categorie:sheetCat,libelle:lab,montant:amount,paye_par:payer}); closeSheet(); toast('Dépense modifiée, soldes mis à jour'); }
    else { await api({action:'addExpense',auteur:ME,edition:cur.id,categorie:sheetCat,libelle:lab,montant:amount,paye_par:payer}); lastPayer = payer; closeSheet(); toast('Dépense ajoutée, soldes mis à jour'); }
  } catch(e) { err.textContent = netErr(e); }
  btn.disabled = false; btn.textContent = editId ? 'Enregistrer les modifications' : 'Ajouter la dépense';
}
async function togglePlayer(name){
  const p = cur.participants.find(x=>x.name===name); if (!p || !canWrite()) return;
  const want = !p.player;
  if (!want && cur.participants.filter(x=>x.player).length<=1) { toast('Au moins une personne doit partager le coût.'); return; }
  try { await api({action:'setParticipation',edition:cur.id,nom:name,participe:want}); } catch(e) { toast(netErr(e)); }
}
async function deleteExpense(id){
  if (delPending!==id) { delPending=id; render(); return; }
  delPending=null;
  try { await api({action:'deleteExpense',id}); toast('Dépense supprimée'); } catch(e) { toast(netErr(e)); render(); }
}

document.addEventListener('click', ev=>{
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.id) { setEdition(t.dataset.id); }
  else if (t.dataset.open) { setEdition(t.dataset.open); }
  else if (t.dataset.tab) { tab=t.dataset.tab; delPending=null; render(); window.scrollTo(0,0); }
  else if (t.dataset.sort!==undefined) { sortBal = t.dataset.sort==='1'; render(); }
  else if (t.dataset.goto) { catF = t.dataset.goto; tab = 'dep'; delPending = null; render(); window.scrollTo(0,0); }
  else if (t.dataset.cat) { catF = t.dataset.cat; render(); }
  else if (t.dataset.player) { togglePlayer(t.dataset.player); }
  else if (t.dataset.edit) { const x = expenseRows(cur).find(r=>r.id===t.dataset.edit); if (x) { delPending = null; openSheet(x); } }
  else if (t.dataset.settle) { toggleSettle(t.dataset.settle); }
  else if (t.dataset.del) { deleteExpense(t.dataset.del); }
  else if (t.dataset.fcat) { sheetCat = t.dataset.fcat; drawCats(); updateHint(); }
  else if (t.dataset.xp) { const k=t.dataset.xp, o=t.getAttribute('aria-expanded')==='true'; o?openRows.delete(k):openRows.add(k); t.setAttribute('aria-expanded',String(!o)); $(t.getAttribute('aria-controls')).hidden=o; }
  else if (t.dataset.me!==undefined) { askWho(); }
  else if (t.dataset.push) { pushAction(t.dataset.push); }
  else if (t.id==='fab') { openSheet(); }
  else if (t.id==='sh-x') { closeSheet(); }
  else if (t.classList.contains('prow')) {
    const k = cur.id+':'+t.dataset.i, o = t.getAttribute('aria-expanded')==='true';
    o ? openRows.delete(k) : openRows.add(k);
    t.setAttribute('aria-expanded', String(!o));
    $(t.getAttribute('aria-controls')).hidden = o;
  }
});
$('scrim').addEventListener('click', ev=>{ if (ev.target.id==='scrim') closeSheet(); });
document.addEventListener('keydown', ev=>{ if (ev.key==='Escape' && !$('scrim').hidden) closeSheet(); });
$('addform').addEventListener('submit', submitAdd);
$('f-amount').addEventListener('input', updateHint);
$('f-payer').addEventListener('change', updateHint);
window.addEventListener('hashchange', ()=>{ const id=location.hash.slice(1); if (id && id!==cur.id && byId(id)) setEdition(id,true); });

/* ---------- Synchronisation ---------- */
const CACHE_KEY = 'adl-remote-v1';
function renderSync(){
  const t = {demo:'Démo', pending:'Synchronisation…', offline:'Hors ligne', ok:'À jour · '+(lastSync?lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')}[syncState];
  $('sync').textContent = t;
}
function applyRemote(R){
  const j = JSON.stringify([R.editions,R.expenses,R.participants]);
  if (j===lastJson) { renderSync(); return; }
  lastJson = j; REMOTE = R; rebuild();
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(R)); } catch(e){}
  render(); renderSync();
}
async function pull(){
  if (!API_URL || writing) return;
  const before = canWrite();
  try {
    const r = await fetch(API_URL + (API_URL.includes('?')?'&':'?') + 'action=all&pwd=' + encodeURIComponent(PWD), {cache:'no-store'});
    const j = await r.json();
    if (!j.ok) { if (j.auth) lock(); throw new Error('bad'); }
    syncState = 'ok'; lastSync = new Date(); applyRemote(j.data);
  } catch(e) { syncState = 'offline'; }
  renderSync(); if (before !== canWrite()) render();
}

/* ---------- Identité et notifications ---------- */
let ME = '', pushLater = false;
try { ME = localStorage.getItem('adl-me') || ''; } catch(e){}
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const pushConfigured = () => !!PUSH_URL && !!VAPID_PUBLIC_KEY;
const pushSupported = () => pushConfigured() && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
const pushPaused = () => { try { return localStorage.getItem('adl-push-off') === '1'; } catch(e){ return false; } };
const pushState = () => !pushConfigured() ? 'off' : (!pushSupported() ? (isIOS && !standalone() ? 'ios' : 'none') : (Notification.permission==='granted' && pushPaused() ? 'paused' : Notification.permission));
function knownNames(){
  const set = new Set();
  D.filter(editable).forEach(e=>e.participants.forEach(p=>{ if (p.name && p.name!==CPT) set.add(p.name); }));
  if (!set.size && cur) cur.participants.forEach(p=>{ if (p.name!==CPT) set.add(p.name); });
  return Array.from(set);
}
function askWho(){
  const names = knownNames(); if (!names.length) return;
  $('who-list').innerHTML = names.map(n=>`<button type="button" data-who="${esc(n)}">${esc(n)}</button>`).join('');
  $('who').hidden = false;
}
$('who-list').addEventListener('click', ev=>{
  const b = ev.target.closest('button[data-who]'); if (!b) return;
  ME = b.dataset.who; try { localStorage.setItem('adl-me', ME); } catch(e){}
  $('who').hidden = true; ensureSubscribed();
  render();
});
function pushBar(){
  const st = pushState();
  if (pushLater) return '';
  if (st==='default') return `<div class="pushbar"><b>Activer les notifications</b><p>Soyez prévenu dès qu’une dépense est ajoutée.</p><div class="row"><button class="go" data-push="on">Activer</button><button class="later" data-push="later">Plus tard</button></div></div>`;
  if (st==='ios') return `<div class="pushbar"><b>Notifications sur iPhone</b><p>Touchez Partager, puis « Sur l’écran d’accueil ». Ouvrez ensuite l’appli depuis son icône pour activer les notifications.</p><div class="row"><button class="later" data-push="later">Compris</button></div></div>`;
  return '';
}
function deviceCard(){
  const st = pushState();
  let h = `<section class="card devcard"><h3>Cet appareil</h3><div class="kv"><span>Vous êtes</span><span><b>${esc(ME||'non renseigné')}</b> · <button type="button" data-me>Changer</button></span></div>`;
  if (st!=='off') {
    const txt = st==='granted' ? 'activées' : st==='paused' ? 'désactivées sur cet appareil' : st==='denied' ? 'bloquées (à réactiver dans les réglages du navigateur)' : st==='ios' ? 'à activer depuis l’écran d’accueil' : st==='none' ? 'non disponibles ici' : 'désactivées';
    h += `<div class="kv"><span>Notifications</span><span><b>${txt}</b>${st==='default'||st==='paused'?` · <button type="button" data-push="on">Activer</button>`:st==='granted'?` · <button type="button" data-push="off">Désactiver</button>`:''}</span></div>`;
  }
  return h + '</section>';
}
function pushAction(a){
  if (a==='later') { pushLater = true; render(); return; }
  if (a==='on') { try { localStorage.removeItem('adl-push-off'); } catch(e){} if (Notification.permission==='granted') ensureSubscribed(); else requestPush(); render(); }
  if (a==='off') pushOff();
}
function requestPush(){
  if (!pushSupported()) return;
  const done = res => { render(); if (res==='granted') ensureSubscribed(); };
  try { const r = Notification.requestPermission(done); if (r && r.then) r.then(done); } catch(e){}
}
const urlB64 = v => { v = v.replace(/-/g,'+').replace(/_/g,'/'); return Uint8Array.from(atob(v + '='.repeat((4 - v.length % 4) % 4)), c => c.charCodeAt(0)); };
const pushApi = p => PUSH_URL.replace(/\/+$/,'') + p;
let swReg = null;
async function getReg(){
  if (!swReg) swReg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  return swReg;
}
async function ensureSubscribed(){
  if (!pushSupported() || Notification.permission!=='granted' || !PWD || pushPaused() || ensureSubscribed.busy) return;
  ensureSubscribed.busy = true;
  try {
    const reg = await getReg(), key = urlB64(VAPID_PUBLIC_KEY);
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey) {
      const cur = new Uint8Array(sub.options.applicationServerKey);
      if (cur.length !== key.length || cur.some((x,i)=>x!==key[i])) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
    const stamp = sub.endpoint + '|' + ME; let last = null;
    try { last = JSON.parse(localStorage.getItem('adl-push-sync') || 'null'); } catch(e){}
    if (!last || last.k !== stamp || Date.now() - last.t > 7*864e5) {
      const r = await fetch(pushApi('/subscribe'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({subscription:sub.toJSON(), prenom:ME, pwd:PWD})});
      if (r.ok) { try { localStorage.setItem('adl-push-sync', JSON.stringify({k:stamp, t:Date.now()})); } catch(e){} }
    }
  } catch(e){}
  ensureSubscribed.busy = false;
}
async function pushOff(){
  try { localStorage.setItem('adl-push-off', '1'); localStorage.removeItem('adl-push-sync'); } catch(e){}
  try {
    const reg = await getReg(), sub = await reg.pushManager.getSubscription();
    if (sub) { fetch(pushApi('/unsubscribe'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({endpoint:sub.endpoint, pwd:PWD})}).catch(()=>{}); await sub.unsubscribe(); }
  } catch(e){}
  render();
}
function initPush(){
  if (!pushSupported() || initPush.done) return;
  initPush.done = true;
  getReg().then(ensureSubscribed).catch(()=>{});
}
function afterUnlock(){
  initPush();
  if (!ME) askWho();
}

/* ---------- Démarrage ---------- */
const PW_HASH = '0087d69980609a7e0294e575642ec605b9547a8ca876b0c7391d2d148f37f136';
let PWD = '', started = false;
try { PWD = localStorage.getItem('adl-pwd') || ''; } catch(e){}
const norm = v => String(v||'').trim().toLowerCase();
async function sha(v){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return null; }
}
async function pwdOk(v){ const h = await sha(norm(v)); return !!h && h === PW_HASH; }
function lock(){
  try { localStorage.removeItem('adl-pwd'); } catch(e){}
  PWD = ''; document.body.classList.add('locked'); $('gate').hidden = false; $('gate-pwd').value = ''; $('gate-err').textContent = 'Mot de passe à saisir à nouveau.';
}
function unlock(){ document.body.classList.remove('locked'); $('gate').hidden = true; if (!started) { started = true; start(); } afterUnlock(); }
function start(){
ARCHIVE.forEach(e=>{ const c={'2016-inzinzac':"Après remise de Christian (26,37 € / pers.)",'2020-pauillac':"Après don de Christian et participation au livre (4,70 € / pers.)",'2022-cap-ferret':"Après don de Christian (22,50 € / pers.)",'2023-thonon-les-bains':"Après don de Vince (5,72 € / pers.)",'2024-courville':"Après don de Christian (25,71 € / pers.)"}; e.adjLabel=c[e.id]; });
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if (c && c.editions && c.expenses && c.participants) REMOTE = c; } catch(e){}
rebuild();
const startId = location.hash.slice(1);
cur = byId(startId) || D.filter(x=>x.global_>0).slice(-1)[0];
tab = byId(startId) ? 'syn' : 'ann';
render(); renderSync();
if (API_URL) {
  pull(); setInterval(()=>{ if (document.visibilityState==='visible') pull(); }, 30000);
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') pull(); });
}
}
$('gate-img').src = IMG;
$('gate-form').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const v = $('gate-pwd').value;
  if (await pwdOk(v)) { PWD = norm(v); try { localStorage.setItem('adl-pwd', PWD); } catch(e){} $('gate-err').textContent=''; if (pushSupported() && Notification.permission==='default') requestPush(); unlock(); }
  else { $('gate-err').textContent = 'Mot de passe incorrect.'; $('gate-pwd').select(); }
});
(async()=>{ if (PWD && await pwdOk(PWD)) unlock(); else { document.body.classList.add('locked'); $('gate').hidden = false; } })();
</script>
